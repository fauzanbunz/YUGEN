<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUGEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #000;
            color: #e2e8f0;
            overflow: hidden;
            user-select: none;
        }

        .tech-font { font-family: 'Share Tech Mono', monospace; }

        /* Health Bar Barcode Style */
        .barcode-health {
            display: flex;
            height: 12px;
            gap: 2px;
            background: #111;
            padding: 2px;
            border: 1px solid #333;
        }
        .barcode-segment {
            flex: 1;
            background-color: #ff3333;
            transition: all 0.3s;
        }
        .barcode-segment.empty { background-color: #222; }

        /* Card Styles */
        .slot-container {
            width: 90px;
            height: 130px;
            position: relative;
            perspective: 1000px; /* For 3D flip if needed later */
        }
        
        .empty-slot {
            border: 1px dashed #555;
            background-color: rgba(255,255,255,0.02);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .empty-slot.highlight {
            border-color: #ff3333;
            background-color: rgba(255, 51, 51, 0.1);
        }

        .playing-card {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease-out;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        
        .playing-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
            border-color: #ff3333;
        }
        
        .playing-card.selected {
            border: 1px solid #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.9);
            transform: translateY(-15px);
        }

        /* Animations */
        @keyframes drawCard {
            from { opacity: 0; transform: translateY(50px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes attackUp {
            0% { transform: translateY(0); }
            50% { transform: translateY(-40px) scale(1.1); z-index: 20; }
            100% { transform: translateY(0); z-index: 1;}
        }
        
        @keyframes attackDown {
            0% { transform: translateY(0); }
            50% { transform: translateY(40px) scale(1.1); z-index: 20; }
            100% { transform: translateY(0); z-index: 1;}
        }
        
        @keyframes damageShake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        /* Brush reveal animation for logo */
        @keyframes brushStroke {
            0% { clip-path: inset(0 100% 0 0); transform: scale(0.9) translateX(-20px); opacity: 0.5;}
            100% { clip-path: inset(0 0 0 0); transform: scale(1) translateX(0); opacity: 1;}
        }

        .anim-draw { animation: drawCard 0.4s ease-out forwards; }
        .anim-brush { animation: brushStroke 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .anim-atk-up { animation: attackUp 0.5s ease-in-out; }
        .anim-atk-down { animation: attackDown 0.5s ease-in-out; }
        .anim-shake { animation: damageShake 0.4s; }

        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen relative bg-black">

    <audio id="bgm-player" loop>
        <source src="https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Shogun%20War%20Banner.mp3" type="audio/mpeg">

    <canvas id="matrix-canvas" class="absolute inset-0 z-0 pointer-events-none opacity-40"></canvas>

            </div>

            <div id="opponent-area" class="w-full flex justify-between items-start mb-4 z-30">

                <div class="w-12 h-16 border border-gray-600 rounded shadow-md bg-cover bg-center" style="background-image: url('https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/card%20yugen.png');"></div>

            <div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-4 z-[999] bg-[#0f0f13]/90 border border-gray-700 p-5 rounded-lg shadow-[0_0_20px_rgba(0,0,0,0.8)] backdrop-blur-md">

                <div class="text-[10px] tech-font tracking-widest text-gray-400 flex flex-col gap-2 mb-2">

            <div class="absolute bottom-24 left-8 z-10 flex flex-col items-center">
                <div class="relative w-[70px] h-[100px] cursor-pointer group">
                    <div class="absolute top-2 left-2 w-full h-full border border-gray-600 bg-[#111] rounded"></div>
                    <div class="absolute top-1 left-1 w-full h-full border border-gray-600 bg-[#1a1a24] rounded"></div>
                    <div class="absolute top-0 left-0 w-full h-full border border-gray-500 rounded flex flex-col justify-center items-center shadow-[0_4px_10px_rgba(0,0,0,0.8)] group-hover:-translate-y-2 group-hover:border-red-500 transition-all duration-300 bg-cover bg-center" style="background-image: url('https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/card%20yugen.png');">

            <div id="status-msg" class="absolute bottom-40 left-1/2 -translate-x-1/2 text-white font-bold tracking-widest text-sm px-6 py-2 bg-black/80 border border-gray-700 rounded shadow-lg z-50 pointer-events-none opacity-0 transition-opacity duration-300">

            <div id="player-area" class="w-full flex justify-between items-end mt-4 z-30">

                        </div>
                        <div class="barcode-health flex-row-reverse w-full" id="player-health-bar"></div>
                    </div>
                    <div class="w-20 h-24 border border-gray-600 bg-black overflow-hidden relative group hover:border-red-500 transition-colors shadow-[0_0_10px_rgba(0,0,0,0.8)] hover:shadow-[0_0_15px_rgba(255,0,0,0.6)]">

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Matrix Effect Logic
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let matrixChars = [];
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン';

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class MatrixChar {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.char = katakana[Math.floor(Math.random() * katakana.length)];
                this.opacity = 0;
                this.state = 'fadeIn'; // fadeIn -> stay -> fadeOut -> wait -> reset
                this.fadeSpeed = 0.005 + Math.random() * 0.01;
                this.stayTimer = 50 + Math.random() * 100;
                this.waitTimer = 100 + Math.random() * 300;
            }
            update() {
                if (this.state === 'fadeIn') {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.8) this.state = 'stay';
                } else if (this.state === 'stay') {
                    this.stayTimer--;
                    if (this.stayTimer <= 0) this.state = 'fadeOut';
                } else if (this.state === 'fadeOut') {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0) this.state = 'wait';
                } else if (this.state === 'wait') {
                    this.waitTimer--;
                    if (this.waitTimer <= 0) this.reset();
                }
            }
            draw() {
                if (this.opacity > 0) {
                    ctx.fillStyle = `rgba(255, 0, 0, ${this.opacity})`;
                    ctx.font = '64px "Noto Sans JP"';
                    ctx.fillText(this.char, this.x, this.y);
                }
            }
        }

        function initMatrix() {
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            matrixChars = [];
            for (let i = 0; i < 12; i++) { // Max 12 characters at a time
                matrixChars.push(new MatrixChar());
            }
            animateMatrix();
        }

        function animateMatrix() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            matrixChars.forEach(char => {
                char.update();
                char.draw();
            });
            requestAnimationFrame(animateMatrix);
        }

        // --- GAME LOGIC ---

        const CHARACTERS = [
            { id: 'Aragami', img: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Aragami.png', fig: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Aragami_figur.png', sub: 'FIRE / DARK' },
            { id: 'Eigetsu', img: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Eigetsu.png', fig: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Eigetsu_figur.png', sub: 'WATER / LIGHT' },
            { id: 'Hakurei', img: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Hakurei.png', fig: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Hakurei_figur.png', sub: 'WIND / VOID' },
            { id: 'Kokuyo', img: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Kokuyo.png', fig: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Kokuyo_figur.png', sub: 'DARK / FIRE' },
            { id: 'Muku', img: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Muku.png', fig: 'https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/Muku_figur.png', sub: 'EARTH / LIGHT' }
        ];

        // MENGGUNAKAN 8 GAMBAR KARTU DARI GITHUB
        const CARD_DB = [
            { name: "Flame Spirit", img: "https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/a1.png", atk: 3, hp: 3 },
            { name: "Water Maiden", img: "https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/a2.png", atk: 2, hp: 4 },
            { name: "Wind Samurai", img: "https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/a3.png", atk: 4, hp: 2 },
            { name: "Earth Golem", img: "https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/a4.png", atk: 1, hp: 6 },
            { name: "Light Guide", img: "https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/a5.png", atk: 3, hp: 4 },
            { name: "Dark Avatar", img: "https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/a6.png", atk: 5, hp: 1 },
            { name: "Void Servant", img: "https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/a7.png", atk: 2, hp: 2 },
            { name: "Inferno", img: "https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/a8.png", atk: 4, hp: 3 }
        ];

        const MAX_LIFE = 20;
        const HAND_SIZE = 4;
        const TOTAL_DECK_CARDS = 25;

        let state = {
            turn: 1,
            phase: 'DEPLOY',
            player: { id: '', life: MAX_LIFE, deck: [], hand: [], board: [null, null, null, null, null], img: '' },
            enemy: { id: '', life: MAX_LIFE, deckCount: TOTAL_DECK_CARDS, board: [null, null, null, null, null], img: '' },
            selectedCardIndex: null
        };

        const delay = ms => new Promise(res => setTimeout(res, ms));

        window.onload = () => {
            initMatrix();
            populateCharSelect();
        };

        function enterLanding() {
            // Putar audio secara langsung karena interaksi klik sudah terjadi
            const bgm = document.getElementById('bgm-player');
            bgm.volume = 0.5;
            bgm.play().catch(e => console.log("Audio play failed:", e));
            
            switchScreen('screen-landing');
        }

        function switchScreen(screenId) {
            document.getElementById('screen-pre').style.display = 'none';
            document.getElementById('screen-landing').style.display = 'none';
            document.getElementById('screen-char-select').style.display = 'none';
            document.getElementById('screen-game').style.display = 'none';
            
            const target = document.getElementById(screenId);
            target.style.display = 'flex';
            target.style.opacity = 0;
            setTimeout(() => {
                target.style.transition = 'opacity 0.5s';
                target.style.opacity = 1;
            }, 50);

            // Matikan matrix di game screen agar tidak mengganggu main game
            canvas.style.display = (screenId === 'screen-game') ? 'none' : 'block';
        }

        function populateCharSelect() {
            const container = document.getElementById('char-select-container');
            const figImg = document.getElementById('char-figurine');

            CHARACTERS.forEach(char => {
                const el = document.createElement('div');
                el.className = 'cursor-pointer group flex flex-col items-center';
                el.innerHTML = `
                    <div class="w-40 h-56 border-2 border-gray-700 bg-black overflow-hidden relative group-hover:border-red-500 transition-all duration-300 shadow-lg group-hover:shadow-[0_0_20px_rgba(255,0,0,0.8)]">
                        <img src="${char.img}" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
                        <div class="absolute bottom-0 w-full bg-black/80 p-2 border-t border-gray-700 group-hover:border-red-500">
                            <p class="font-bold tracking-widest text-sm text-center">${char.id.toUpperCase()}</p>
                            <p class="text-[10px] text-red-400 tech-font text-center">${char.sub}</p>
                        </div>
                    </div>
                `;
                
                el.onmouseenter = () => {
                    figImg.src = char.fig;
                    figImg.style.opacity = 1;
                    figImg.style.transform = 'translateX(0)';
                };
                
                el.onmouseleave = () => {
                    figImg.style.opacity = 0;
                    figImg.style.transform = 'translateX(-10px)';
                };

                el.onclick = () => startGame(char);
                container.appendChild(el);
            });
        }

        function startGame(playerChar) {
            state.player.id = playerChar.id.toUpperCase();
            state.player.img = playerChar.img;
            document.getElementById('player-name').innerText = state.player.id;
            document.getElementById('player-portrait').src = state.player.img;
            
            const enemies = CHARACTERS.filter(c => c.id !== playerChar.id);
            const randEnemy = enemies[Math.floor(Math.random() * enemies.length)];
            
            state.enemy.id = randEnemy.id.toUpperCase();
            state.enemy.img = randEnemy.img;
            document.getElementById('opp-name').innerText = state.enemy.id;
            document.getElementById('opp-portrait').src = state.enemy.img;

            initGame();
            switchScreen('screen-game');
        }

        function createDeck() {
            let newDeck = [];
            for(let i=0; i < TOTAL_DECK_CARDS; i++) {
                const randIndex = Math.floor(Math.random() * CARD_DB.length);
                newDeck.push({ ...CARD_DB[randIndex], instanceId: Math.random().toString(36).substr(2, 9) });
            }
            return newDeck;
        }

        function getRandomCard() {
            const randIndex = Math.floor(Math.random() * CARD_DB.length);
            return { ...CARD_DB[randIndex] };
        }

        function initGame() {
            state.player.life = MAX_LIFE;
            state.enemy.life = MAX_LIFE;
            state.player.deck = createDeck();
            state.enemy.deckCount = TOTAL_DECK_CARDS;
            state.player.board = [null, null, null, null, null];
            state.enemy.board = [null, null, null, null, null];
            state.turn = 1;
            state.phase = 'DEPLOY';
            
            updateHealthBars();
            drawInitialCards();
            updateUI();
        }

        function updateHealthBars() {
            document.getElementById('player-life-text').innerText = state.player.life;
            document.getElementById('opp-life-text').innerText = state.enemy.life;

            const pBar = document.getElementById('player-health-bar');
            const oBar = document.getElementById('opp-health-bar');
            pBar.innerHTML = ''; oBar.innerHTML = '';
            
            for(let i=0; i<MAX_LIFE; i++) {
                pBar.innerHTML += `<div class="barcode-segment ${i >= state.player.life ? 'empty' : ''}"></div>`;
                oBar.innerHTML += `<div class="barcode-segment ${i >= state.enemy.life ? 'empty' : ''}"></div>`;
            }
        }

        function updateDeckUI() {
            document.getElementById('player-deck-count').innerText = state.player.deck.length;
            document.getElementById('opp-deck-count').innerText = state.enemy.deckCount;
        }

        function drawInitialCards() {
            state.player.hand = [];
            for(let i=0; i<HAND_SIZE; i++) {
                if (state.player.deck.length > 0) state.player.hand.push(state.player.deck.pop());
            }
            state.enemy.deckCount = Math.max(0, state.enemy.deckCount - HAND_SIZE);
            renderHand();
            updateDeckUI();
        }

        function drawCard() {
            if(state.player.hand.length < HAND_SIZE + 2 && state.player.deck.length > 0) {
                state.player.hand.push(state.player.deck.pop());
                renderHand();
                updateDeckUI();
            }
        }

        // GENERATE KARTU (GAMBAR a1-a8.png SEBAGAI COVER)
        function generateCardHTML(card, context = 'hand', index = -1, isFaceDown = false) {
            const clickAction = context === 'hand' ? `onclick="selectCardFromHand(${index})"` : '';
            
            if (isFaceDown) {
                // Gambar belakang YUGEN saat kartu musuh baru muncul (tertutup)
                return `
                    <div class="playing-card anim-draw border border-gray-600 bg-cover bg-center" style="background-image: url('https://raw.githubusercontent.com/fauzanbunz/YUGEN/main/card%20yugen.png');"></div>
                `;
            }

            // Gambar depan menggunakan link a1-a8.png langsung dari card.img
            return `
                <div class="playing-card anim-draw border border-gray-600 bg-cover bg-center ${context === 'hand' ? 'hover:-translate-y-4' : ''}" ${clickAction} id="${context}-card-${index}" style="background-image: url('${card.img}');">
                    <div class="absolute bottom-0 w-full h-6 bg-black/90 flex justify-between items-center px-2 text-[10px] font-bold border-t border-gray-700">
                        <span class="text-red-400"><i class="fa-solid fa-burst"></i> ${card.atk}</span>
                        <span class="text-green-400"><i class="fa-solid fa-shield-heart"></i> ${card.hp}</span>
                    </div>
                </div>
            `;
        }

        function renderHand() {
            const handContainer = document.getElementById('player-hand');
            handContainer.innerHTML = '';
            state.player.hand.forEach((card, index) => {
                handContainer.innerHTML += `<div class="slot-container w-[90px] h-[130px]">` + generateCardHTML(card, 'hand', index) + `</div>`;
            });
        }

        function renderBoard() {
            for(let i=0; i<5; i++) {
                const pSlot = document.querySelector(`.player-slot[data-index="${i}"]`);
                if(state.player.board[i]) {
                    pSlot.innerHTML = generateCardHTML(state.player.board[i], 'board', i);
                    pSlot.classList.remove('empty-slot');
                } else {
                    pSlot.innerHTML = '';
                    pSlot.classList.add('empty-slot');
                }

                const eSlot = document.querySelector(`.opp-slot[data-index="${i}"]`);
                // Only re-render if it's already flipped face up to avoid resetting enemy animation state
                if(state.enemy.board[i] && !eSlot.querySelector('.face-down-marker')) {
                    eSlot.innerHTML = generateCardHTML(state.enemy.board[i], 'board', i);
                    eSlot.classList.remove('empty-slot');
                } else if (!state.enemy.board[i]) {
                    eSlot.innerHTML = '';
                    eSlot.classList.add('empty-slot');
                }
            }
        }

        function logGame(msg) {
            const logEl = document.getElementById('game-log');
            logEl.innerHTML = `> ${msg}<br>` + logEl.innerHTML;
        }

        function setStatus(msg) {
            const statusEl = document.getElementById('status-msg');
            statusEl.innerText = msg;
            statusEl.style.opacity = 1;
            setTimeout(() => statusEl.style.opacity = 0, 2000);
        }

        function updateUI() {
            document.getElementById('turn-indicator').innerText = `TURN ${state.turn.toString().padStart(2, '0')}`;
            const btn = document.getElementById('btn-action');
            
            document.getElementById('step-deploy').className = state.phase === 'DEPLOY' ? 'text-white' : 'text-gray-600';
            document.getElementById('step-act').className = state.phase === 'ACT' ? 'text-white' : 'text-gray-600';

            if(state.phase === 'DEPLOY') {
                btn.innerText = 'BATTLE';
                btn.className = "w-32 py-3 font-bold tracking-widest border transition-all uppercase cursor-pointer bg-red-600 text-white border-red-400 hover:bg-red-500 hover:shadow-[0_0_15px_rgba(255,51,51,0.6)]";
                btn.disabled = false;
            } else {
                btn.innerText = 'WAIT...';
                btn.className = "w-32 py-3 font-bold tracking-widest border transition-all uppercase cursor-not-allowed bg-gray-700 text-gray-400 border-gray-600 opacity-50";
                btn.disabled = true;
            }
        }

        function selectCardFromHand(index) {
            if(state.phase !== 'DEPLOY') return;
            
            if(state.selectedCardIndex !== null) {
                document.getElementById(`hand-card-${state.selectedCardIndex}`).classList.remove('selected');
            }
            
            if(state.selectedCardIndex === index) {
                state.selectedCardIndex = null;
                return;
            }

            state.selectedCardIndex = index;
            document.getElementById(`hand-card-${index}`).classList.add('selected');
            setStatus("Select slot to deploy.");
            document.querySelectorAll('.player-slot.empty-slot').forEach(slot => slot.classList.add('highlight'));
        }

        function playCardToSlot(slotIndex) {
            if(state.phase !== 'DEPLOY' || state.selectedCardIndex === null) return;
            if(state.player.board[slotIndex] !== null) return;

            const card = state.player.hand.splice(state.selectedCardIndex, 1)[0];
            state.player.board[slotIndex] = card;
            state.selectedCardIndex = null;
            
            document.querySelectorAll('.player-slot').forEach(s => s.classList.remove('highlight'));
            logGame(`Deployed ${card.name}.`);
            
            renderHand();
            renderBoard();
        }

        function flashDamage(target) {
            const overlay = document.getElementById('flash-overlay');
            if(target === 'player') {
                overlay.style.backgroundColor = 'rgba(255, 0, 0, 0.4)';
                document.getElementById('player-portrait').parentElement.classList.add('anim-shake');
            } else {
                overlay.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
                document.getElementById('opp-portrait').parentElement.classList.add('anim-shake');
            }
            
            setTimeout(() => {
                overlay.style.backgroundColor = 'rgba(0,0,0,0)';
                document.getElementById('player-portrait').parentElement.classList.remove('anim-shake');
                document.getElementById('opp-portrait').parentElement.classList.remove('anim-shake');
            }, 300);
        }

        async function startBattlePhase() {
            if (state.phase !== 'DEPLOY') return;
            state.phase = 'ACT';
            state.selectedCardIndex = null;
            renderHand();
            updateUI();
            logGame("BATTLE ENGAGED");
            await delay(1000);
            await resolveCombat();
        }

        async function resolveCombat() {
            for(let i=0; i<5; i++) {
                const pCard = state.player.board[i];
                const eCard = state.enemy.board[i];
                const pSlot = document.querySelector(`.player-slot[data-index="${i}"]`);
                const eSlot = document.querySelector(`.opp-slot[data-index="${i}"]`);

                if(pCard) {
                    if (pSlot && pSlot.firstElementChild) {
                        pSlot.firstElementChild.style.animation = 'none';
                        pSlot.firstElementChild.offsetHeight;
                        pSlot.firstElementChild.style.animation = 'attackUp 0.5s ease-in-out';
                    }
                    await delay(250);
                    
                    if(eCard) {
                        eCard.hp -= pCard.atk;
                        logGame(`${pCard.name} hits ${eCard.name}`);
                        if(eSlot && eSlot.firstElementChild) eSlot.firstElementChild.classList.add('anim-shake');
                    } else {
                        state.enemy.life -= pCard.atk;
                        logGame(`Direct Hit! CPU takes ${pCard.atk} dmg.`);
                        flashDamage('enemy');
                    }
                    updateHealthBars();
                    await delay(350);
                }

                if(eCard && eCard.hp > 0) {
                    if (eSlot && eSlot.firstElementChild) {
                        eSlot.firstElementChild.style.animation = 'none';
                        eSlot.firstElementChild.offsetHeight;
                        eSlot.firstElementChild.style.animation = 'attackDown 0.5s ease-in-out';
                    }
                    await delay(250);
                    
                    if(pCard && pCard.hp > 0) {
                        pCard.hp -= eCard.atk;
                        logGame(`${eCard.name} counters ${pCard.name}`);
                        if(pSlot && pSlot.firstElementChild) pSlot.firstElementChild.classList.add('anim-shake');
                    } else {
                        state.player.life -= eCard.atk;
                        logGame(`CPU Direct Hit! You take ${eCard.atk} dmg.`);
                        flashDamage('player');
                    }
                    updateHealthBars();
                    await delay(350);
                }

                if(pCard && pCard.hp <= 0) state.player.board[i] = null;
                if(eCard && eCard.hp <= 0) state.enemy.board[i] = null;
                
                renderBoard();
                if(state.player.life <= 0 || state.enemy.life <= 0) break;
            }

            await delay(1000);
            
            if(state.player.life <= 0) gameOver("DEFEAT");
            else if (state.enemy.life <= 0) gameOver("VICTORY");
            else startEnemyTurn();
        }

        async function startEnemyTurn() {
            state.phase = 'ENEMY_TURN';
            updateUI();
            setStatus("Enemy thinking...");
            await delay(1000);

            let emptySlots = [];
            for(let i=0; i<5; i++) if(!state.enemy.board[i]) emptySlots.push(i);
            emptySlots.sort(() => Math.random() - 0.5);
            
            const cardsToPlay = Math.min(2, emptySlots.length);
            for(let i=0; i<cardsToPlay; i++) {
                if(state.enemy.deckCount <= 0) break;
                
                const slotIndex = emptySlots[i];
                const enemyCard = getRandomCard();
                state.enemy.board[slotIndex] = enemyCard;
                state.enemy.deckCount--;
                updateDeckUI();
                
                const eSlot = document.querySelector(`.opp-slot[data-index="${slotIndex}"]`);
                eSlot.classList.remove('empty-slot');
                
                // Animasi kartu turun tertutup
                eSlot.innerHTML = `<div class="face-down-marker w-full h-full">` + generateCardHTML(enemyCard, 'board', slotIndex, true) + `</div>`;
                await delay(500); 

                // Animasi flip terbuka diganti isinya langsung
                const innerContainer = eSlot.querySelector('.face-down-marker');
                if (innerContainer) {
                    innerContainer.style.transition = 'transform 0.3s ease-in';
                    innerContainer.style.transform = 'scaleX(0)'; // Efek memipih (mulai memutar)
                    
                    await delay(300);
                    
                    // Ganti dengan kartu asli (Terbuka)
                    eSlot.innerHTML = generateCardHTML(enemyCard, 'board', slotIndex, false);
                    eSlot.firstElementChild.style.transform = 'scaleX(0)'; 
                    
                    // Paksa browser me-render state scaleX(0)
                    eSlot.firstElementChild.offsetHeight; 
                    
                    // Kembalikan ke normal
                    eSlot.firstElementChild.style.transition = 'transform 0.3s ease-out';
                    eSlot.firstElementChild.style.transform = 'scaleX(1)';
                }
                
                await delay(300); 
            }

            setStatus("Turn ended.");
            await delay(1000);

            state.turn++;
            if(state.enemy.deckCount > 0) state.enemy.deckCount--; 
            drawCard(); 
            state.phase = 'DEPLOY';
            updateUI();
            updateDeckUI();
        }

        function gameOver(result) {
            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-[1000]';
            overlay.innerHTML = `
                <h1 class="text-7xl font-black mb-4 tracking-[0.3em] ${result === 'VICTORY' ? 'text-red-500' : 'text-gray-600'}">${result}</h1>
                <p class="text-gray-400 tech-font tracking-widest mb-8">SIMULATION TERMINATED.</p>
                <button onclick="location.reload()" class="px-8 py-3 bg-transparent text-white font-bold tracking-widest border border-gray-500 hover:border-red-500 hover:text-red-500 transition-colors cursor-pointer">
                    RESTART
                </button>
            `;
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
